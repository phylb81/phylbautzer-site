<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phyl Bautzer</title>
<meta name="description" content="Phyl Bautzer, Creative Director and Creative Strategist. New website under construction.">
<link rel="canonical" href="https://phylbautzer.com/">
<link rel="preload" href="/case-studies/poapm/assets/fonts/Gate-Regular.otf" as="font" type="font/otf" crossorigin>
<style>
@font-face {
  font-family: "Gate";
  src: url("/case-studies/poapm/assets/fonts/Gate-Regular.otf") format("opentype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

:root {
  --ivory: #fbf8ee;
  --black: #232220;
  --font-display: "Gate", Georgia, serif;
  --pad-x: clamp(20px, 8.34vw, 120px);
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  background: var(--black);
  color: var(--ivory);
  font-family: var(--font-display);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  padding: clamp(24px, 3.5vw, 52px) var(--pad-x);
}

a { color: inherit; text-decoration: none; }
a:hover, a:focus-visible { text-decoration: underline; text-underline-offset: 0.2em; }

.work {
  margin: 0 0 clamp(40px, 5vw, 72px);
}

.work__label {
  margin: 0 0 16px;
  font-size: clamp(14px, 1.1vw, 16px);
  letter-spacing: 0.25em;
  text-transform: uppercase;
  opacity: 0.6;
}

.work ul {
  margin: 0;
  padding: 0;
  list-style: none;
}

.work li + li {
  margin-top: 8px;
}

.work a {
  font-size: clamp(24px, 2.6vw, 36px);
  line-height: 1.25;
}

.work a span {
  display: inline-block;
  margin-left: 0.3em;
  transition: transform 0.25s ease;
}

.work a:hover span,
.work a:focus-visible span {
  transform: translateX(6px);
}

@media (prefers-reduced-motion: reduce) {
  .work a span { transition: none; }
}

.name, .contact {
  margin: 0;
  font-size: clamp(16px, 1.4vw, 20px);
  letter-spacing: 0.01em;
}

.title {
  align-self: center;
  margin: 0;
  max-width: 14ch;
  font-weight: 400;
  font-size: clamp(48px, 8.4vw, 132px);
  line-height: 1.02;
  letter-spacing: -0.01em;
}
</style>
</head>
<body>
  <p class="name">Phyl Bautzer</p>
  <h1 class="title">New website under construction.</h1>
  <nav class="work" aria-label="Case studies">
    <p class="work__label">Case studies</p>
    <ul>
      <li><a href="/case-studies/poapm/">The Power of a Praying Mom<span aria-hidden="true">&rarr;</span></a></li>
      <li><a href="/case-studies/itv/">It Takes a Village<span aria-hidden="true">&rarr;</span></a></li>
    </ul>
  </nav>
  <p class="contact"><a href="mailto:philippe.bautzer@gmail.com">philippe.bautzer@gmail.com</a></p>
</body>
</html>
